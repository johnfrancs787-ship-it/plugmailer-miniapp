<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>PlugMailer</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #f3f4f6;
      --panel: #151e30;
      --border: #273449;
      --muted: #a6b1c2;
      --accent: #48a9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 16px 36px;
      background: #0b1120;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    h1 { margin: 0 0 6px; font-size: 26px; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    p { color: var(--muted); line-height: 1.5; }

    section {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat, .item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong { font-size: 21px; }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 14px;
    }

    input, textarea, button {
      width: 100%;
      border-radius: 9px;
      font: inherit;
    }

    input, textarea {
      padding: 11px 12px;
      border: 1px solid var(--border);
      outline: none;
      background: #0b1120;
      color: #f3f4f6;
    }

    textarea { min-height: 120px; resize: vertical; }

    button {
      margin-top: 12px;
      padding: 12px 14px;
      border: 0;
      background: var(--accent);
      color: #06111d;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: #f3f4f6;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 9px;
      background: #1d2a3e;
      overflow-wrap: anywhere;
    }

    .message.error { color: #ffc1c1; }
    .message.success { color: #b8f5cc; }

    .item {
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>

<body>
<main>
  <header>
    <h1>PlugMailer</h1>
    <p>Consultez vos campagnes et gérez vos comptes SMTP.</p>
  </header>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <section>
    <h2>Tableau de bord</h2>
    <div class="stats">
      <div class="stat">
        <span>E-mails envoyés</span>
        <strong id="sent-count">—</strong>
      </div>
      <div class="stat">
        <span>E-mails en attente</span>
        <strong id="pending-count">—</strong>
      </div>
      <div class="stat">
        <span>Échecs</span>
        <strong id="failed-count">—</strong>
      </div>
      <div class="stat">
        <span>Campagnes actives</span>
        <strong id="active-count">—</strong>
      </div>
    </div>
    <button id="refresh-button" class="secondary" type="button">
      Actualiser
    </button>
  </section>

  <section>
    <h2>Mes SMTP</h2>
    <div id="smtp-list"><p class="muted">Chargement…</p></div>
    <button id="smtp-refresh-button" class="secondary" type="button">
      Actualiser les SMTP
    </button>
  </section>

  <section>
    <h2>Créer une campagne</h2>

    <form id="campaign-form">
      <label for="campaign-title">Nom de la campagne</label>
      <input id="campaign-title" required maxlength="200"
             placeholder="Ex. Newsletter novembre">

      <label for="sender-name">Nom de l’expéditeur</label>
      <input id="sender-name" required maxlength="200"
             placeholder="Ex. Mon entreprise">

      <label for="campaign-subject">Objet de l’e-mail</label>
      <input id="campaign-subject" required maxlength="998"
             placeholder="Ex. Les nouveautés de cette semaine">

      <label for="campaign-content">Message</label>
      <textarea id="campaign-content" required maxlength="1000000"
                placeholder="Écrivez votre message ici."></textarea>

      <label>
        <input id="is-html" type="checkbox" style="width:auto">
        Le contenu du message est au format HTML
      </label>

      <label for="campaign-recipients">
        Destinataires — une adresse e-mail par ligne
      </label>
      <textarea id="campaign-recipients" required
                placeholder="client1@example.com&#10;client2@example.com"></textarea>

      <button id="campaign-submit" type="submit">
        Créer la campagne
      </button>
    </form>
  </section>
</main>

<script>
  // Remplace cette valeur par l’URL HTTPS exacte du service FastAPI sur Render.
  const API_URL = "https://TON-SERVICE.onrender.com".replace(/\/+$/, "");

  const telegramApp = window.Telegram?.WebApp;
  const messageBox = document.getElementById("message");

  if (telegramApp) {
    telegramApp.ready();
    telegramApp.expand();
  }

  function showMessage(text, type = "success") {
    messageBox.textContent = text;
    messageBox.className = `message ${type}`;
    messageBox.style.display = "block";
  }

  async function api(path, options = {}) {
    if (!telegramApp?.initData) {
      throw new Error("Ouvrez cette Mini App depuis Telegram.");
    }

    const headers = new Headers(options.headers || {});
    headers.set("Authorization", `tma ${telegramApp.initData}`);

    if (options.body !== undefined && !headers.has("Content-Type")) {
      headers.set("Content-Type", "application/json");
    }

    let response;

    try {
      response = await fetch(`${API_URL}${path}`, {
        ...options,
        headers
      });
    } catch {
      throw new Error(
        "Impossible de joindre le backend. Vérifiez son URL et son état sur Render."
      );
    }

    const contentType = response.headers.get("content-type") || "";
    const data = contentType.includes("application/json")
      ? await response.json()
      : await response.text();

    if (!response.ok) {
      const detail = data && typeof data === "object"
        ? data.detail || data.message
        : data;

      throw new Error(detail || `Erreur API (${response.status})`);
    }

    return data;
  }

  async function loadDashboard() {
    const data = await api("/api/dashboard");
    const stats = data.stats || {};

    document.getElementById("sent-count").textContent = stats.sent ?? 0;
    document.getElementById("pending-count").textContent = stats.pending ?? 0;
    document.getElementById("failed-count").textContent = stats.failed ?? 0;

    const activeCampaigns = data.active_campaigns || [];
    document.getElementById("active-count").textContent =
      Array.isArray(activeCampaigns) ? activeCampaigns.length : 0;
  }

  async function checkSmtp(id) {
    return api(`/api/smtps/${encodeURIComponent(id)}/check`, {
      method: "POST"
    });
  }

  async function loadSmtps() {
    const data = await api("/api/smtps");
    const list = document.getElementById("smtp-list");
    const smtps = Array.isArray(data.smtps) ? data.smtps : [];

    list.replaceChildren();

    if (smtps.length === 0) {
      const empty = document.createElement("p");
      empty.className = "muted";
      empty.textContent = "Aucun compte SMTP actif.";
      list.append(empty);
      return;
    }

    for (const smtp of smtps) {
      const item = document.createElement("div");
      item.className = "item";

      const title = document.createElement("strong");
      title.textContent = smtp.email || smtp.username || `SMTP ${smtp.id}`;
      item.append(title);

      const details = document.createElement("p");
      details.className = "muted";
      details.textContent = [
        smtp.host,
        smtp.port ? `port ${smtp.port}` : "",
        smtp.encryption || "",
        smtp.last_check_ok === true
          ? "Vérifié"
          : smtp.last_check_ok === false
            ? "Dernier test échoué"
            : "Non vérifié"
      ].filter(Boolean).join(" · ");
      item.append(details);

      const checkButton = document.createElement("button");
      checkButton.type = "button";
      checkButton.className = "secondary";
      checkButton.textContent = "Vérifier le SMTP";

      checkButton.addEventListener("click", async () => {
        checkButton.disabled = true;

        try {
          const result = await checkSmtp(smtp.id);
          if (result.valid) {
            showMessage("Le SMTP fonctionne.", "success");
          } else {
            showMessage(
              result.error || "La vérification du SMTP a échoué.",
              "error"
            );
          }
          await loadSmtps();
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          checkButton.disabled = false;
        }
      });

      item.append(checkButton);
      list.append(item);
    }
  }

  async function createCampaign(payload) {
    return api("/api/campaigns", {
      method: "POST",
      body: JSON.stringify(payload)
    });
  }

  async function loadCampaignEvents(campaignId, lastEventId = 0) {
    const id = encodeURIComponent(campaignId);
    const afterId = encodeURIComponent(lastEventId);
    return api(`/api/campaigns/${id}/events?after_id=${afterId}`);
  }

  async function refreshPage() {
    try {
      await Promise.all([loadDashboard(), loadSmtps()]);
      showMessage("Données actualisées.", "success");
    } catch (error) {
      showMessage(error.message, "error");
    }
  }

  document.getElementById("refresh-button")
    .addEventListener("click", refreshPage);

  document.getElementById("smtp-refresh-button")
    .addEventListener("click", async () => {
      try {
        await loadSmtps();
        showMessage("Liste SMTP actualisée.", "success");
      } catch (error) {
        showMessage(error.message, "error");
      }
    });

  document.getElementById("campaign-form")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = document.getElementById("campaign-submit");
      const recipients = document
        .getElementById("campaign-recipients")
        .value
        .split(/\r?\n/)
        .map(address => address.trim())
        .filter(Boolean);

      const payload = {
        title: document.getElementById("campaign-title").value.trim(),
        sender_name: document.getElementById("sender-name").value.trim(),
        subject: document.getElementById("campaign-subject").value.trim(),
        content: document.getElementById("campaign-content").value,
        is_html: document.getElementById("is-html").checked,
        recipients
      };

      if (recipients.length === 0) {
        showMessage("Ajoutez au moins une adresse e-mail.", "error");
        return;
      }

      submitButton.disabled = true;

      try {
        const result = await createCampaign(payload);
        const campaign = result.campaign || {};
        showMessage(
          `Campagne créée${campaign.id ? ` (n° ${campaign.id})` : ""}.`,
          "success"
        );
        event.currentTarget.reset();
        await loadDashboard();
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        submitButton.disabled = false;
      }
    });

  if (telegramApp?.initData) {
    refreshPage();
  } else {
    showMessage(
      "Ouvrez la Mini App depuis le bouton du bot Telegram.",
      "error"
    );
  }
</script>
</body>
</html>
